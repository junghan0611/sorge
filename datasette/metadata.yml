# sorge — 이슈판을 가로질러 보는 렌즈
#
# DB 는 이 집 것이 아니다. Magit Forge 가 쓰는 GLG 의 로컬 캐시이고 소유는
# `doomemacs-config` 다. 여기 사는 것은 **그 위에 얹는 시야**뿐이다 —
# 리포 하나가 결코 가질 수 없는 것, 전체를 가로지르는 눈.
#
# 읽기만 한다. 쓰기는 언제나 API 를 지나고(GLG 는 `forge-*` 명령, 에이전트는
# `gh` + `(my/forge-pull-all t)`), DB 는 그 결과를 받아 적을 뿐이다.
#
# 띄울 때 `--immutable`/`-i` 를 붙이지 않는다. 그 플래그는 "이 파일은 안 바뀐다"
# 를 전제해 락과 변경 감지를 끄고 행 수를 시작 시점에 굳힌다. 이 파일은 GLG 의
# Emacs 가 `forge-pull` 할 때마다 바뀐다 (SQLite 문서 · datasette#1870).
#
# 값이 따옴표째 저장돼 있어 `replace(x,'"','')` 가 필요하다. 그건 이 DB 의 사실이지
# 우리가 고칠 자리가 아니다.
title: sorge — 이슈판 (Magit Forge 캐시 · GitHub)
description_html: |-
  <p>Magit Forge 의 로컬 캐시를 <b>읽기 전용</b>으로 본다. 원본은 GitHub 이고,
  이 파일은 GLG 의 Emacs 가 <code>forge-pull</code> 로 채운다.</p>

  <p><b>「포지」가 세 물건을 가리킨다.</b> 어원만 같고 가리키는 것도 방향도 다르다 —
  헷갈리는 게 당연하다(GLG, 2026-09-04: <i>"다들 포지라고 하면 헷갈려하네"</i>):</p>
  <ul>
    <li><b>Forgejo</b> — 셀프호스팅 서버 <code>forge.junghanacs.com</code>.
        <code>forge</code> 스킬과 <code>forge-config</code> 리포가 그것을 <b>조작한다(쓴다)</b>.</li>
    <li><b>Magit Forge</b> — Emacs 클라이언트. 이 페이지의 <code>forge-database</code> 가
        그것이 GitHub 에서 긁어 만든 캐시다. 여기서는 <b>조회만(읽는다)</b>.</li>
    <li><b>이 판</b> — 위 캐시 위에 얹은 sorge 의 렌즈. 저장하는 것이 없다.</li>
  </ul>

  <p>그래서 <b>Forgejo 이슈는 여기 구조적으로 안 들어온다</b> —
  <code>forge-forgejo.el:29</code> 가 <code>forge-unusedapi-repository</code> 를 상속하고
  그 <code>forge--pull</code> 은 <code>git fetch</code> 뿐이다. 그 축은 REST 로 따로 본다.</p>

  <p><b>직접 SQL 을 쓸 때 함정 둘.</b> ① 값이 따옴표째 저장돼 있다 —
  <code>where forge = 'github.com'</code> 은 <b>0건</b>을 낸다(실측 2026-09-04).
  <code>replace(x,'"','')</code> 를 거쳐라. ② <code>issue.repository</code> 는 base64 id 라
  그대로 group by 하면 사람이 못 읽는다. <code>join repository on repository.id</code> 를 걸어라.
  아래 저장된 쿼리 넷은 둘 다 이미 하고 있다.</p>

databases:
  forge-database:
    queries:
      cross_repo:
        title: 횡단 이슈 — 다른 리포를 이름으로 부르는 open 이슈
        description: 이 집이 존재하는 이유. 이슈의 경계는 리포에서 끝나지 않는다.
        sql: |-
          with r as (
            select replace(name,'"','') n from repository
            where replace(owner,'"','') = 'junghan0611'
          )
          select
            replace(rr.name,'"','')  as repo,
            i.number                 as "#",
            replace(i.title,'"','')  as title,
            group_concat(distinct r.n) as mentions,
            count(distinct r.n)      as n,
            substr(replace(i.updated,'"',''),1,10) as updated
          from issue i
          join repository rr on i.repository = rr.id
          join r on r.n <> replace(rr.name,'"','')
               and (i.body like '%'||r.n||'%' or i.title like '%'||r.n||'%')
          where i.state = 'open'
          group by i.id
          order by n desc, updated desc

      board:
        title: 열린 판 — 리포별 open 이슈 전부
        sql: |-
          select
            replace(r.name,'"','')   as repo,
            i.number                 as "#",
            replace(i.title,'"','')  as title,
            substr(replace(i.updated,'"',''),1,10) as updated
          from issue i join repository r on i.repository = r.id
          where i.state = 'open'
          order by repo, i.number

      by_repo:
        title: 리포별 집계 — 어디가 두꺼운가
        sql: |-
          select
            replace(r.name,'"','') as repo,
            sum(i.state = 'open')  as open,
            count(*)               as total,
            substr(max(replace(i.updated,'"','')),1,10) as last_touch
          from issue i join repository r on i.repository = r.id
          group by repo order by open desc, total desc

      stale_open:
        title: 오래 열린 것 — 손이 안 간 순서
        description: 닫을지 이어갈지 사람이 정할 자리. 순회가 판정하지 않는다.
        sql: |-
          select
            replace(r.name,'"','')   as repo,
            i.number                 as "#",
            replace(i.title,'"','')  as title,
            substr(replace(i.updated,'"',''),1,10) as updated,
            cast(julianday('now') - julianday(substr(replace(i.updated,'"',''),1,10)) as int) as days
          from issue i join repository r on i.repository = r.id
          where i.state = 'open'
          order by days desc
